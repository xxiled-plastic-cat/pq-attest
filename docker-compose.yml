services:
  pq-attest:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      CADDY_SITE_ADDRESS: ":8080"
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const r = await fetch('http://127.0.0.1:8080/health'); if (!r.ok) process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
